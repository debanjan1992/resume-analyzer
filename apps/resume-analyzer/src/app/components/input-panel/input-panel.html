<div
  class="input-panel-card rounded-lg shadow-md p-8 bg-white border-t-[6px] border-indigo-600"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="inputs flex gap-12">
      <section class="resume flex-1">
        <header class="flex items-center justify-between mb-4">
          <div class="title flex items-center gap-2 font-medium">
            <span class="material-symbols-outlined text-blue-500">
              two_pager
            </span>
            <span class="text-sm">Your Resume</span>
          </div>
          <p class="text-xs text-zinc-400">(Required)</p>
        </header>
        <div class="content flex flex-col">
          <div class="mb-4">
            <label
              for="file-upload"
              class="flex flex-col items-center justify-center w-full h-48 border-2 border-slate-300 border-dashed rounded-2xl cursor-pointer bg-white hover:bg-slate-50 transition-colors duration-300"
            >
              <div class="flex flex-col items-center justify-center">
                <div
                  class="w-12 h-12 mb-4 bg-blue-50 rounded-full flex items-center justify-center"
                >
                  <svg
                    class="w-6 h-6 text-blue-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                    ></path>
                  </svg>
                </div>

                <p class="text-md font-semibold text-slate-700">
                  Click to upload PDF or drag and drop
                </p>

                <p class="text-sm font-medium text-slate-400">
                  PDFs up to 5MB (Text-based only)
                </p>
              </div>
              <input
                id="file-upload"
                type="file"
                class="hidden"
                accept="application/pdf"
              />
            </label>
          </div>
          <div
            class="divider flex items-center gap-2 mb-4 text-gray-400 justify-center"
          >
            <span class="text-lg">----------------------</span>
            <span class="text-xs">or paste text directly</span>
            <span class="text-lg">----------------------</span>
          </div>
          <textarea
            [rows]="6"
            formControlName="resumeText"
            [placeholder]="resumePlaceholder()"
            class="w-full resize-none border border-gray-300 rounded-md p-4 flex-1"
          ></textarea>
        </div>
      </section>
      <section class="target-job-description flex-1 flex flex-col">
        <header class="flex items-center justify-between mb-4">
          <div class="title flex items-center gap-2 font-medium">
            <span class="material-symbols-outlined text-purple-500">
              work
            </span>
            <span class="text-sm">Target Job Description</span>
          </div>
          <p class="text-xs text-zinc-400">(Required)</p>
        </header>
        <div class="content flex-1">
          <textarea
            formControlName="targetJobDescription"
            [rows]="10"
            [placeholder]="jobDescriptionPlaceholder()"
            class="w-full resize-none border border-gray-300 rounded-md p-4 h-full"
          ></textarea>
        </div>
      </section>
    </div>
    <footer class="flex justify-end mt-6">
      <button
        class="flex items-center gap-1 bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        type="submit"
        [disabled]="form.invalid"
      >
        <span class="material-symbols-outlined text-white"> toys_fan </span>
        <span>Analyze Resume</span>
      </button>
    </footer>
  </form>
</div>
