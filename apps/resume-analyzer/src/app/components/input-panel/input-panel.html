<div
  class="input-panel-card rounded-lg shadow-md p-8 bg-white border-t-[6px] border-indigo-600"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col">
    <div class="inputs inline-flex flex-col lg:flex-row gap-12">
      <section class="resume flex-1">
        <header class="flex items-center justify-between mb-4">
          <div class="title flex items-center gap-2 font-medium">
            <span class="material-symbols-outlined text-blue-500">
              two_pager
            </span>
            <span class="text-sm">Your Resume</span>
          </div>
          <p class="text-xs text-zinc-400">(Required)</p>
        </header>
        <div class="content flex flex-col">
          <div class="mb-4">
            <label
              for="file-upload"
              class="flex flex-col items-center justify-center w-full h-48 border-2 border-slate-300 border-dashed rounded-2xl cursor-pointer bg-white hover:bg-slate-50 transition-colors duration-300"
            >
              @if(!selectedFile()) {
              <div class="flex flex-col items-center justify-center">
                <div
                  class="w-12 h-12 mb-4 bg-blue-50 rounded-full flex items-center justify-center"
                >
                  <svg
                    class="w-6 h-6 text-blue-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                    ></path>
                  </svg>
                </div>

                <p class="text-md font-semibold text-slate-700 text-center">
                  Click to upload PDF
                </p>

                <p class="text-sm font-medium text-slate-400">
                  PDFs up to 5MB (Text-based only)
                </p>
              </div>
              } @else {
              <div
                class="flex flex-col items-center justify-center animate-fade-in"
              >
                <div
                  class="w-12 h-12 mb-4 bg-red-100 text-red-500 rounded-full flex items-center justify-center"
                >
                  <svg
                    class="w-6 h-6"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
                    ></path>
                  </svg>
                </div>

                <p
                  class="mb-1 text-md font-bold text-slate-800 break-all px-4 text-center"
                >
                  {{ selectedFile()?.name }}
                </p>

                <p class="mb-4 text-sm text-slate-500">
                  {{ (selectedFile()?.size || 0) / 1024 / 1024 | number:'1.2-2'
                  }} MB
                </p>

                <div class="actions flex gap-2">
                  <span
                    class="px-4 py-2 text-sm font-medium text-blue-600 bg-blue-100 rounded-lg hover:bg-blue-200 transition-colors"
                  >
                    Change File
                  </span>
                </div>
              </div>
              }
              <input
                id="file-upload"
                type="file"
                class="hidden"
                accept="application/pdf"
                (change)="onFileSelected($event)"
              />
            </label>
          </div>
          <div
            class="divider flex items-center gap-2 mb-4 text-gray-400 justify-center"
          >
            <hr class="flex-grow border-t border-gray-200" />
            <span class="text-xs">or paste text directly</span>
            <hr class="flex-grow border-t border-gray-200" />
          </div>
          <textarea
            [rows]="6"
            formControlName="resumeText"
            [placeholder]="resumePlaceholder()"
            class="w-full resize-none border border-gray-300 rounded-md p-4 flex-1 disabled:opacity-50 disabled:cursor-not-allowed"
          ></textarea>
        </div>
      </section>
      <section class="target-job-description flex-1 flex flex-col">
        <header class="flex items-center justify-between mb-4">
          <div class="title flex items-center gap-2 font-medium">
            <span class="material-symbols-outlined text-purple-500">
              work
            </span>
            <span class="text-sm">Target Job Description</span>
          </div>
          <p class="text-xs text-zinc-400">(Required)</p>
        </header>
        <div class="content flex-1">
          <textarea
            formControlName="targetJobDescription"
            [rows]="10"
            [placeholder]="jobDescriptionPlaceholder()"
            class="w-full resize-none border border-gray-300 rounded-md p-4 h-full disabled:opacity-50 disabled:cursor-not-allowed"
          ></textarea>
        </div>
      </section>
    </div>
    <footer class="flex flex-col md:flex-row justify-end mt-6 gap-4">
      <input
          type="text"
          formControlName="apiKey"
          class="bg-white placeholder:text-slate-400 text-slate-700 text-sm border border-slate-200 rounded-md px-3 py-2 w-full md:w-2/5 transition duration-300 ease-in-out focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 hover:border-slate-300 shadow-sm focus:shadow w-2/5 shrink-0"
          placeholder="Enter Gemini API Key here..."
        />
      <button
        class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed text-center"
        type="submit"
        [disabled]="form.invalid || store.isLoading()"
      >
        <span>Analyze Resume</span>
      </button>
    </footer>
  </form>
</div>
