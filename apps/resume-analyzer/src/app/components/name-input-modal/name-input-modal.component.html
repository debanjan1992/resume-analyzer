<div class="space-y-4 p-4">
  <p class="text-gray-600">
    {{ 'INPUT.NAME_MODAL.DESCRIPTION' | translate }}
  </p>

  <div class="space-y-2">
    <label for="userName" class="block text-sm font-medium text-gray-700">
      {{ 'INPUT.NAME_MODAL.LABEL' | translate }}
    </label>
    <input
      type="text"
      id="userName"
      [(ngModel)]="userName"
      (keydown.enter)="submitName()"
      class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      [placeholder]="'INPUT.NAME_MODAL.PLACEHOLDER' | translate"
      [class.border-red-500]="nameError"
    />
    @if (nameError) {
      <p class="text-red-500 text-sm mt-1">{{ nameError | translate }}</p>
    }
  </div>
</div>

<div class="flex justify-end gap-3 mt-12 bg-stone-200 p-4">
  <button
    (click)="close()"
    class="px-4 py-2 text-gray-700 font-medium hover:bg-gray-100 rounded-lg transition-colors cursor-pointer"
  >
    {{ 'INPUT.NAME_MODAL.CANCEL' | translate }}
  </button>
  <button
    (click)="submitName()"
    class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200 cursor-pointer"
  >
    {{ 'INPUT.NAME_MODAL.NEXT' | translate }}
  </button>
</div>
