<div class="relative flex items-center justify-center">
  
  <div class="absolute inset-0 flex flex-col items-center justify-center z-10">
    
    <span class="text-5xl font-bold transition-colors duration-300" [ngClass]="colorClass()">
      {{ score() }}
    </span>
    
    <span class="text-md font-medium mt-1" [ngClass]="colorClass()">
      {{ labelText() }}
    </span>
  </div>

  <svg class="w-70 h-70 transform -rotate-90" viewBox="0 0 320 320">
    <circle
      cx="160"
      cy="160"
      [attr.r]="radius"
      fill="none"
      stroke-width="20"
      class="text-slate-100 stroke-current"
    ></circle>

    <circle
      cx="160"
      cy="160"
      [attr.r]="radius"
      fill="none"
      stroke-width="20"
      stroke-linecap="round"
      [attr.stroke-dasharray]="circumference"
      [attr.stroke-dashoffset]="dashOffset()"
      class="stroke-current transition-all duration-1000 ease-out"
      [ngClass]="colorClass()"
    ></circle>
  </svg>
</div>
