<header
  class="w-full bg-white rounded-t-3xl px-6 py-4 flex items-center justify-between shadow-lg"
>
  <div class="flex items-center gap-3">
    <div
      class="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-blue-200 shadow-md"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="w-6 h-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"
        />
      </svg>
    </div>
    <div class="flex flex-col justify-center">
      <h1 class="text-slate-900 font-bold text-lg leading-tight">
        {{ 'HEADER.TITLE' | translate }}
      </h1>
    </div>
  </div>

  <nav
    class="bg-slate-100 p-1 rounded-full flex items-center gap-1 hidden md:block"
  >
    <button
      class="bg-white text-slate-800 px-5 py-1.5 rounded-full text-sm font-semibold shadow-sm transition-all"
    >
      {{ 'HEADER.NAV.ANALYSIS' | translate }}
    </button>
    <button
      class="text-slate-500 hover:text-slate-700 px-5 py-1.5 rounded-full text-sm font-medium transition-colors"
    >
      {{ 'HEADER.NAV.EDITOR' | translate }}
    </button>
    <button
      class="text-slate-500 hover:text-slate-700 px-5 py-1.5 rounded-full text-sm font-medium transition-colors"
    >
      {{ 'HEADER.NAV.HISTORY' | translate }}
    </button>
  </nav>

  <div class="flex items-center gap-4">
    <div class="text-right hidden sm:block">
      <p class="text-slate-900 font-semibold text-sm leading-tight">
        {{ 'HEADER.USER.NAME' | translate }}
      </p>
      <p class="text-slate-400 text-xs font-medium">
        {{ 'HEADER.USER.PLAN' | translate }}
      </p>
    </div>

    <button
      class="relative p-2 text-slate-400 hover:text-slate-600 transition-colors"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="w-6 h-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"
        />
      </svg>
      <span
        class="absolute top-2 right-2.5 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white"
      ></span>
    </button>

    <div
      class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-sm"
    >
      {{ 'HEADER.INITIALS' | translate }}
    </div>
  </div>
</header>
