<div
  class="w-full max-w-4xl mx-auto bg-white rounded-xl shadow-lg border border-slate-100 p-12 text-center animate-fade-in"
>
  <div class="mb-6 relative inline-block">
    <div
      class="absolute inset-0 bg-blue-100 rounded-full animate-ping opacity-75"
    ></div>
    <div
      class="relative w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center"
    >
      <svg
        class="w-8 h-8 animate-pulse"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13 10V3L4 14h7v7l9-11h-7z"
        ></path>
      </svg>
    </div>
  </div>

  <h3 class="text-2xl font-bold text-slate-800">
    {{ 'ANALYSIS.TITLE' | translate }}
  </h3>
  <p class="text-slate-500 mb-8 transition-all duration-300 text-xs mt-2">
    {{ 'ANALYSIS.DISCLAIMER' | translate }}
  </p>
  <div class="relative w-full h-1 bg-slate-100 rounded-full overflow-hidden">
    <div
      class="absolute top-0 left-0 h-full w-1/3 bg-gradient-to-r from-transparent via-blue-600 to-transparent rounded-full animate-shimmer"
    ></div>
  </div>
  <p class="text-indigo-500 transition-all duration-300 text-sm mt-2">
    {{ currentMessage() | translate }}
  </p>
  <p class="text-slate-500 mb-8 transition-all duration-300 text-xs scale-90">
    {{ 'ANALYSIS.WAIT_MESSAGE' | translate }}
  </p>
</div>
