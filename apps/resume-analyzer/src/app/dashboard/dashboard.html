<div id="dashboard" class="my-4">
  <header class="flex flex-col gap-4 md:flex-row mb-8">
    <div class="title flex flex-col flex-1 text-center md:text-left">
      <h1 class="text-3xl font-bold mb-1">Analysis Report</h1>
      <h4 class="text-sm text-stone-500">
        Generated on {{ date | date : 'shortDate'}} - Target Role:
        {{store.analysisResult()?.targetRole}}
      </h4>
    </div>
    <div class="actions flex justify-center items-center gap-2">
      <button
        class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-md bg-white text-gray-700 hover:bg-gray-100 transition-colors font-medium text-sm cursor-pointer"
      >
        <span class="material-symbols-outlined">download</span>
        <span>Download Report</span>
      </button>
      <button
        class="flex items-center gap-2 px-4 py-2 rounded-md bg-indigo-600 hover:bg-indigo-700 text-white font-medium shadow transition-colors text-sm cursor-pointer"
        [routerLink]="['/']"
      >
        <span class="material-symbols-outlined">edit</span>
        <span>Try another</span>
      </button>
    </div>
  </header>
  <main>
    @if(store.analysisResult()?.criticalFixes?.length !== 0) {
    <div
      class="alert-banner bg-red-100 border border-red-300 text-red-800 rounded-md p-4 mb-6 flex items-center gap-2"
    >
      <span class="material-symbols-outlined text-red-600">warning</span>
      <span class="font-medium"
        >Your resume has critical issues that need immediate attention. Please
        review the 'Critical Fixes' section below.</span
      >
    </div>
    }
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <app-ats-score class="col-span-1"></app-ats-score>
      <app-score-breakdown class="col-span-1"></app-score-breakdown>
      <app-quick-wins class="col-span-1"></app-quick-wins>
      <app-jd-match class="col-span-1 md:col-span-2"></app-jd-match>
      <app-impact-language class="col-span-1"></app-impact-language>
      <app-soft-skills class="col-span-1"></app-soft-skills>
      <app-structure-check class="col-span-1"></app-structure-check>
      <app-quantifiable-impact class="col-span-1"></app-quantifiable-impact>
      <app-recommendations class="col-span-1 md:col-span-2"></app-recommendations>
      <app-critical-fixes class="col-span-1"></app-critical-fixes>
    </div>
  </main>
</div>
