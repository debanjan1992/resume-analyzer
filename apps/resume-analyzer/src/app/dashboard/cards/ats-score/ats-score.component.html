<div
  class="w-full h-full bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden p-6 flex flex-col items-center"
>
  <header class="text-center font-semibold text-stone-600">
    OVERALL ATS SCORE
  </header>
  <app-score-circle [score]="store.analysisResult()?.overallScore || 0">

  <footer class="text-center text-xs text-gray-500">
    ATS Score indicates how well your resume is optimized for Applicant Tracking
    Systems.
  </footer>
</div>
